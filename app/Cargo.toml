[package]
name = "serene-vr-encoder"
version = "0.1.0"
edition = "2021"
description = "Prepare 360/VR video for Meta Quest headsets"
default-run = "serene-vr-encoder"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "serene-vr-encoder"
path = "src/main.rs"

[profile.release]
opt-level = 2
